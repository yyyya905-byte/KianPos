<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كيان Kian POS — نظام نقاط بيع احترافي</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pos-screen.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- ============ شاشة تسجيل الدخول ============ -->
<div id="login-screen" class="card" style="position:fixed; inset:0; margin:auto; width:min(360px,92vw); height:fit-content; padding:32px; display:flex; flex-direction:column; gap:16px; z-index:500;">
    <div style="text-align:center;">
        <div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:grid;place-items:center;margin:0 auto 10px;">
            <span class="material-symbols-rounded" style="color:#fff;font-size:28px;">storefront</span>
        </div>
        <h1 style="font-size:20px;font-weight:800;">كيان Kian POS</h1>
        <p style="font-size:12.5px;color:var(--text-muted);">نظام نقاط بيع احترافي</p>
    </div>
    <form id="login-form" style="display:flex;flex-direction:column;gap:12px;">
        <div class="field">
            <label>اسم المستخدم</label>
            <input id="login-username" type="text" autocomplete="username" required>
        </div>
        <div class="field">
            <label>كلمة المرور</label>
            <input id="login-password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">تسجيل الدخول</button>
    </form>
    <p style="font-size:11px;color:var(--text-muted);text-align:center;">أول تشغيل؟ استخدم admin / admin123 ثم غيّرها فورًا</p>
</div>

<!-- ============ التطبيق ============ -->
<div id="app" class="hidden">
    <div id="app-shell" style="height:100dvh; display:flex; flex-direction:column;">
        <header class="topbar">
            <div class="topbar__brand">
                <span class="logo-dot"></span>
                <span class="brand-text">كيان Kian POS</span>
            </div>
            <div class="topbar__actions">
                <button class="icon-btn" id="theme-toggle" title="تبديل الوضع الداكن/الفاتح">
                    <span class="material-symbols-rounded">dark_mode</span>
                </button>
                <button class="icon-btn" id="btn-logout" title="تسجيل الخروج">
                    <span class="material-symbols-rounded">logout</span>
                </button>
            </div>
        </header>

        <main class="main-view">
            <!-- ===== شاشة البيع ===== -->
            <section id="panel-pos" class="tab-panel">
                <div class="pos-mobile-switch">
                    <button data-mobile-view="products" class="active">المنتجات</button>
                    <button data-mobile-view="invoice">الفاتورة</button>
                </div>

                <div class="pos-search">
                    <div class="pos-search-wrap">
                        <input id="pos-search-input" type="text" placeholder="ابحث بالاسم أو الباركود أو الكود...">
                        <span class="material-symbols-rounded">search</span>
                    </div>
                </div>

                <div class="pos-products card">
                    <div class="pos-products__grid" id="pos-products-grid"></div>
                </div>

                <div class="pos-invoice card">
                    <div class="pos-invoice__customer" id="pos-customer-bar">
                        <span class="material-symbols-rounded">person</span>
                        <span>عميل نقدي (اضغط لاختيار عميل)</span>
                    </div>
                    <div class="pos-invoice__items" id="pos-invoice-items"></div>
                    <div class="pos-invoice__totals">
                        <div class="totals-row"><span>عدد القطع</span><span id="pos-item-count">0</span></div>
                        <div class="totals-row"><span>المجموع الفرعي</span><span id="pos-subtotal">0.00</span></div>
                        <div class="totals-row"><span>الخصم</span><span id="pos-discount">0.00</span></div>
                        <div class="totals-row"><span>الضريبة</span><span id="pos-tax">0.00</span></div>
                        <div class="totals-row grand"><span>الإجمالي</span><span id="pos-grand-total">0.00</span></div>
                    </div>
                    <div class="pos-invoice__actions">
                        <button class="btn btn-outline" id="btn-hold-invoice">
                            <span class="material-symbols-rounded" style="font-size:18px;">bookmark_add</span> تعليق
                        </button>
                        <button class="btn btn-outline" id="btn-recall-invoice">
                            <span class="material-symbols-rounded" style="font-size:18px;">restore</span> استرجاع
                        </button>
                        <button class="btn btn-ghost" id="btn-clear-cart" style="grid-column:1/3;">إفراغ الفاتورة</button>
                        <button class="btn btn-primary btn-lg pos-invoice__pay" id="btn-pay">
                            <span class="material-symbols-rounded">payments</span> الدفع (F4)
                        </button>
                    </div>
                </div>
            </section>

            <!-- ===== المخزون ===== -->
            <section id="panel-inventory" class="tab-panel scrollable" data-requires-permission="inventory.view">
                <div class="section-header"><h2>المخزون</h2>
                    <button class="btn btn-primary btn-sm" id="btn-add-product">+ منتج جديد</button>
                </div>
                <div id="inventory-content"></div>
            </section>

            <!-- ===== العملاء ===== -->
            <section id="panel-customers" class="tab-panel scrollable">
                <div class="section-header"><h2>العملاء</h2>
                    <button class="btn btn-primary btn-sm" id="btn-add-customer">+ عميل جديد</button>
                </div>
                <div id="customers-content"></div>
            </section>

            <!-- ===== المرتجعات ===== -->
            <section id="panel-returns" class="tab-panel scrollable">
                <div class="section-header"><h2>المرتجعات واسترجاع المبيعات</h2></div>
                <div id="returns-content"></div>
            </section>

            <!-- ===== التقارير ===== -->
            <section id="panel-reports" class="tab-panel scrollable">
                <div class="section-header"><h2>التقارير</h2></div>
                <div id="reports-content"></div>
            </section>

            <!-- ===== الإدارة (مستخدمون + إعدادات + سجل عمليات) ===== -->
            <section id="panel-admin" class="tab-panel scrollable" data-requires-permission="users.manage">
                <div class="section-header"><h2>الإدارة</h2></div>
                <div id="admin-content"></div>
            </section>
        </main>

        <nav class="tabbar">
            <button class="tabbar__item active" data-tab="pos"><span class="material-symbols-rounded">point_of_sale</span>البيع</button>
            <button class="tabbar__item" data-tab="inventory"><span class="material-symbols-rounded">inventory_2</span>المخزون
                <span class="badge" id="inventory-badge" style="display:none;"></span>
            </button>
            <button class="tabbar__item" data-tab="customers"><span class="material-symbols-rounded">group</span>العملاء</button>
            <button class="tabbar__item" data-tab="returns"><span class="material-symbols-rounded">assignment_return</span>المرتجعات</button>
            <button class="tabbar__item" data-tab="reports"><span class="material-symbols-rounded">bar_chart</span>التقارير</button>
            <button class="tabbar__item" data-tab="admin"><span class="material-symbols-rounded">admin_panel_settings</span>الإدارة</button>
        </nav>
    </div>
</div>

<div id="print-receipt" style="display:none;"></div>

<!-- مكتبات خارجية -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

<script type="module" src="js/app.js"></script>
</body>
</html>
